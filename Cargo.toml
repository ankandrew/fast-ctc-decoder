[package]
name = "fast_ctc_decoder"
version = "0.3.7"
authors = ["Vlado Boza <bozavlado@gmail.com>", "Chris Seymour <chris.seymour@nanoporetech.com>", "Jabari Holder <jholder@and.digital>", "ankandrew <61120139+ankandrew@users.noreply.github.com>"]
description = "Fast CTC decoding library."
license = "MIT"
repository = "https://github.com/ankandrew/fast-ctc-decoder"
homepage = "https://github.com/ankandrew/fast-ctc-decoder"
edition = "2018"

[lib]
name = "fast_ctc_decoder"
crate-type = ["cdylib"]

[dependencies]
ndarray-stats = "0.5"
ndarray = "0.15.3"

# python build
pyo3 = { version = "0.19.2", features = ["extension-module"], optional = true }
numpy = { version = "0.19.0", optional = true }
indexmap = { version = "1.6.2", features = ["std"] }
proc-macro2 = "1.0.82"

[features]
default = ["fastexp", "resolver"]
python = ["pyo3", "numpy"]
fastexp = []
resolver = []

[profile.release]
lto=true
codegen-units=1
panic="abort"
