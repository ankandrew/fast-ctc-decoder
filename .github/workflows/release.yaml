name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    name: Test (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: runner.os != 'Windows'
        run: make setup-rust

      - name: Install Rust toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Rust unit tests
        run: cargo test

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-python: true

      - name: Python unit tests
        run: |
          uv pip install numpy .
          python tests/test_decode.py

  linux-wheels:
    name: Build Linux ${{ matrix.platform.arch }} wheels
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        if: matrix.platform.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Install Rust toolchain
        run: make setup-rust

      - uses: Swatinem/rust-cache@v2

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          rust-toolchain: 1.90.0
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: >-
            --release
            --out dist
            --compatibility pypi
            -i python3.9
            -i python3.10
            -i python3.11
            -i python3.12
            -i python3.13
            -i python3.14

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.platform.arch }}-wheels
          path: dist/*.whl

  osx-wheels:
    name: Build macOS wheels
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: make setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-python: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          rust-toolchain: 1.90.0
          target: universal2-apple-darwin
          args: --release --strip --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: osx-${{ matrix.python-version }}-wheel
          path: dist/*.whl

  windows-wheels:
    name: Build Windows wheels
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-python: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          rust-toolchain: 1.90.0
          args: --release --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: make setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-python: true
      - name: Build sdist
        run: uvx maturin==1.13.3 sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - linux-wheels
      - osx-wheels
      - windows-wheels
      - sdist
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fast-ctc-decoder
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
